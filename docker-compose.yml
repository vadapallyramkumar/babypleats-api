services:
  postgres:
    image: postgres:16
    container_name: babypleats-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: babypleats
      POSTGRES_PASSWORD: babypleats
      POSTGRES_DB: babypleats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babypleats -d babypleats"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://babypleats:babypleats@postgres:5432/babypleats?schema=public"
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:5173"
      API_WRITE_KEY: "${API_WRITE_KEY}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET}"
      CLOUDINARY_UPLOAD_PRESET: "${CLOUDINARY_UPLOAD_PRESET}"
      CLOUDINARY_FOLDER: "${CLOUDINARY_FOLDER:-babypleates/products}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
